<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenSource Atlas · 开源星图</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1020;color:#e7edff}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:50px 16px;background:linear-gradient(#1a3262,#0b1020)}h1{font-size:clamp(2rem,6vw,3.5rem);margin:0}header p,.meta{color:#aab9d6}main{max-width:1100px;margin:auto;padding:24px}.tools{display:flex;gap:10px;flex-wrap:wrap}input,select,button{background:#172540;color:white;border:1px solid #39517a;border-radius:10px;padding:12px}input{flex:1;min-width:200px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}.card{background:#141f34;border:1px solid #304361;border-radius:14px;padding:18px}.card a{color:#a8ccff;font-weight:bold;overflow-wrap:anywhere}.card p{color:#b6c2d8;line-height:1.5}.small{font-size:12px;color:#99accb}footer{text-align:center;padding:30px;color:#99accb}</style></head><body><header><h1>🌌 OpenSource Atlas</h1><p id="subtitle"></p></header><main><div class="tools"><button id="lang">English</button><input id="search"><select id="category"></select><select id="sort"></select></div><p class="meta" id="meta"></p><div class="grid" id="results"></div></main><footer>GitHub Stars ≠ security or quality · Stars 不代表安全或质量</footer><script>
const T={zh:{subtitle:'开源星图 · 每个分类 GitHub Stars 前 50',search:'搜索项目、简介或语言',all:'所有分类',rank:'分类排名',stars:'Stars 降序',recent:'最近提交',empty:'暂无数据，请先运行 GitHub Actions 更新排行榜。',entries:'条分类记录',unique:'个不同仓库',updated:'更新时间',license:'许可证'},en:{subtitle:'Discover the top 50 starred repositories per category',search:'Search repositories, descriptions or languages',all:'All categories',rank:'Category rank',stars:'Stars descending',recent:'Recent commits',empty:'No data yet. Run the GitHub Actions refresh workflow.',entries:'category entries',unique:'unique repositories',updated:'Updated',license:'License'}};let lang=localStorage.getItem('atlas-lang')||'zh',data={categories:[]};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const t=T[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('subtitle').textContent=t.subtitle;$('search').placeholder=t.search;$('lang').textContent=lang==='zh'?'English':'中文';const selected=$('category').value;$('category').innerHTML='<option value="">'+t.all+'</option>'+data.categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(lang==='zh'?c.name:c.name_en)+'</option>').join('');$('category').value=selected;const order=$('sort').value;$('sort').innerHTML='<option value="rank">'+t.rank+'</option><option value="stars">'+t.stars+'</option><option value="recent">'+t.recent+'</option>';$('sort').value=order||'rank';let rows=data.categories.filter(c=>!selected||c.id===selected).flatMap(c=>c.repositories.map(r=>({...r,category:lang==='zh'?c.name:c.name_en})));const q=$('search').value.toLowerCase().trim();if(q)rows=rows.filter(r=>[r.name,r.description,r.language,r.category,...(r.topics||[])].join(' ').toLowerCase().includes(q));if(order==='stars')rows.sort((a,b)=>b.stars-a.stars);if(order==='recent')rows.sort((a,b)=>b.updated_at.localeCompare(a.updated_at));$('meta').textContent=rows.length+' '+t.entries+' · '+new Set(rows.map(r=>r.name)).size+' '+t.unique+' · '+t.updated+': '+(data.updated_at||'—');$('results').innerHTML=rows.map(r=>'<article class="card"><div class="small">#'+r.rank+' · '+esc(r.category)+' · ★ '+Number(r.stars).toLocaleString()+'</div><h3><a target="_blank" rel="noopener noreferrer" href="'+esc(r.url)+'">'+esc(r.name)+'</a></h3><p>'+esc(r.description||'—')+'</p><div class="small">'+esc(r.language)+' · '+t.license+': '+esc(r.license)+'</div></article>').join('')||'<p>'+t.empty+'</p>'}fetch('./data.json').then(r=>r.json()).then(x=>{data=x;draw()}).catch(()=>draw());$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('atlas-lang',lang);draw()};['search','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',draw));draw();
</script></body></html>
